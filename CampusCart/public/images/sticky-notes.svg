<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
      <defs>
        <filter id="sticky-shadow">
          <feDropShadow dx="4" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15" />
        </filter>
      </defs>
      <rect width="600" height="500" fill="#F1F5F9" rx="24"/>
      <!-- Fan / stack of colorful pastel sticky pads -->
      <!-- Green Pad -->
      <g transform="translate(140, 160) rotate(-12, 100, 100)" filter="url(#sticky-shadow)">
        <rect x="0" y="0" width="160" height="160" rx="8" fill="#86EFAC"/>
        <line x1="20" y1="30" x2="140" y2="30" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="20" y1="55" x2="120" y2="55" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="20" y1="80" x2="100" y2="80" stroke="#16A34A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </g>
      <!-- Pink Pad -->
      <g transform="translate(220, 130) rotate(8, 100, 100)" filter="url(#sticky-shadow)">
        <rect x="0" y="0" width="160" height="160" rx="8" fill="#F472B6"/>
        <line x1="20" y1="30" x2="140" y2="30" stroke="#BE185D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="20" y1="55" x2="130" y2="55" stroke="#BE185D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </g>
      <!-- Classic Canary Yellow Pad in front -->
      <g transform="translate(200, 170)" filter="url(#sticky-shadow)">
        <!-- Stack thickness -->
        <rect x="0" y="5" width="180" height="180" rx="8" fill="#FDE047" opacity="0.7"/>
        <rect x="0" y="0" width="180" height="180" rx="8" fill="#FEF08A"/>
        <!-- Top glue band -->
        <rect x="0" y="0" width="180" height="24" rx="8" fill="#FACC15" opacity="0.5"/>
        <text x="25" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#854D0E">Exam Revision:</text>
        <text x="25" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#A16207">✓ Chapter 4 Quiz</text>
        <text x="25" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#A16207">✓ Lab Report 2</text>
        <text x="25" y="131" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#A16207">✓ Submit by 5 PM</text>
        <!-- Little curled bottom right corner -->
        <path d="M 160 180 L 180 160 L 160 160 Z" fill="#EAB308"/>
      </g>
    </svg>