<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
      <defs>
        <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0284C7" />
          <stop offset="100%" stop-color="#0369A1" />
        </linearGradient>
        <filter id="pcase-shadow">
          <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.14" />
        </filter>
      </defs>
      <rect width="600" height="500" fill="#F8FAFC" rx="24"/>
      <g transform="translate(120, 150)" filter="url(#pcase-shadow)">
        <!-- Pencil case body -->
        <rect x="0" y="0" width="360" height="150" rx="30" fill="url(#fabric)"/>
        <!-- Texture stitch line -->
        <rect x="10" y="10" width="340" height="130" rx="22" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
        <!-- Zipper line -->
        <line x1="20" y1="50" x2="340" y2="50" stroke="#0C4A6E" stroke-width="6"/>
        <line x1="20" y1="50" x2="340" y2="50" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="3 3"/>
        <!-- Zipper pull -->
        <g transform="translate(240, 42)">
          <rect x="0" y="0" width="22" height="16" rx="4" fill="#94A3B8"/>
          <path d="M 22 8 L 45 8" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
          <circle cx="48" cy="8" r="5" fill="#475569"/>
        </g>
        <!-- Leather logo patch -->
        <rect x="135" y="80" width="90" height="35" rx="6" fill="#B45309"/>
        <text x="180" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">STUDY ESSENTIALS</text>
      </g>
    </svg>