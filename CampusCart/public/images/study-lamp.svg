<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
      <defs>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
        </linearGradient>
        <filter id="lamp-shadow">
          <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.1" />
        </filter>
      </defs>
      <rect width="600" height="500" fill="#F8FAFC" rx="24"/>
      <!-- Soft Light Cone -->
      <polygon points="280,110 490,440 160,440" fill="url(#glow)"/>
      <g transform="translate(190, 80)" filter="url(#lamp-shadow)">
        <!-- Base -->
        <ellipse cx="80" cy="330" rx="70" ry="16" fill="#1E293B"/>
        <rect x="70" y="322" width="20" height="6" rx="3" fill="#38BDF8"/>
        <!-- Touch button dots -->
        <circle cx="50" cy="330" r="3" fill="#64748B"/>
        <circle cx="110" cy="330" r="3" fill="#64748B"/>
        <!-- Main Stem -->
        <path d="M 80 325 L 80 180 C 80 120, 140 100, 200 90" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
        <!-- Lamp Head -->
        <rect x="180" y="80" width="120" height="20" rx="8" fill="#0F172A"/>
        <rect x="185" y="96" width="110" height="6" rx="2" fill="#FEF08A"/>
      </g>
    </svg>