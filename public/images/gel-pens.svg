          <rect x="30" y="80" width="18" height="30" fill="#EF4444"/>
          <rect x="36" y="70" width="6" height="50" rx="3" fill="#E2E8F0"/>
        </g>
        <!-- Pen 4: Classic Black -->
        <g transform="translate(150, -15) rotate(15, 100, 200)">
          <rect x="30" y="40" width="18" height="270" rx="9" fill="#18181B"/>
          <path d="M 30 40 L 39 10 L 48 40 Z" fill="#94A3B8"/>
          <path d="M 38 10 L 39 4 L 40 10 Z" fill="#0F172A"/>
          <rect x="30" y="80" width="18" height="30" fill="#71717A"/>
          <rect x="36" y="70" width="6" height="50" rx="3" fill="#E2E8F0"/>
