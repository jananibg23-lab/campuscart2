<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
      <defs>
        <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F8FAFC" />
          <stop offset="100%" stop-color="#EEF2F6" />
        </linearGradient>
        <filter id="preshadow">
          <feDropShadow dx="3" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
        </filter>
      </defs>
      <rect width="600" height="500" fill="url(#bg2)" rx="24"/>
      <!-- Set of 5 luxury gel pens -->
      <g transform="translate(140, 60)" filter="url(#preshadow)">
