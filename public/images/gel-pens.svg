        <!-- Pen 5: Violet -->
        <g transform="translate(200, -20) rotate(15, 100, 200)">
          <rect x="30" y="40" width="18" height="270" rx="9" fill="#5B21B6"/>
          <path d="M 30 40 L 39 10 L 48 40 Z" fill="#94A3B8"/>
