<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
      <defs>
        <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="35%" stop-color="#94A3B8" />
          <stop offset="55%" stop-color="#F8FAFC" />
          <stop offset="85%" stop-color="#64748B" />
          <stop offset="100%" stop-color="#1E293B" />
        </linearGradient>
        <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="50%" stop-color="#334155" />
          <stop offset="100%" stop-color="#0F172A" />
        </linearGradient>
        <filter id="bottle-shadow">
          <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
        </filter>
      </defs>
      <rect width="600" height="500" fill="#F8FAFC" rx="24"/>
      <g transform="translate(235, 60)" filter="url(#bottle-shadow)">
        <!-- Handle loop -->
        <path d="M 45 10 C 45 -5, 85 -5, 85 10 L 85 25 L 45 25 Z" fill="#0F172A"/>
        <rect x="52" y="5" width="26" height="15" rx="4" fill="#F8FAFC"/>
        <!-- Cap -->
        <rect x="35" y="25" width="60" height="35" rx="6" fill="url(#cap)"/>
        <!-- Neck -->
        <rect x="42" y="60" width="46" height="25" fill="#475569"/>
        <!-- Shoulder -->
        <path d="M 42 85 C 30 100, 0 115, 0 145 L 0 355 C 0 365, 10 375, 20 375 L 110 375 C 120 375, 130 365, 130 355 L 130 145 C 130 115, 100 100, 88 85 Z" fill="url(#metal)"/>
        <!-- Subtle laser-etched logo -->
        <text x="65" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="2" opacity="0.8">CAMPUS 750ML</text>
        <text x="65" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="1">DOUBLE WALL VACUUM</text>
      </g>
    </svg>