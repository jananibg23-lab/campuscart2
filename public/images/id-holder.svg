<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
      <defs>
        <filter id="card-shadow">
          <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.12" />
        </filter>
      </defs>
      <rect width="600" height="500" fill="#F1F5F9" rx="24"/>
      <!-- Lanyard strap -->
      <path d="M 300 0 C 300 60, 260 90, 290 130" fill="none" stroke="#2563EB" stroke-width="20" stroke-linecap="round"/>
      <rect x="282" y="125" width="20" height="25" rx="4" fill="#94A3B8"/>
      <!-- Metal Clip -->
      <path d="M 287 145 L 297 145 L 295 170 L 289 170 Z" fill="#64748B"/>
      <!-- ID Badge Holder -->
      <g transform="translate(195, 170)" filter="url(#card-shadow)">
        <rect x="0" y="0" width="210" height="280" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
        <rect x="80" y="8" width="50" height="8" rx="4" fill="#CBD5E1"/>
        <!-- Top header bar on card -->
        <rect x="15" y="30" width="180" height="42" rx="6" fill="#1E3A8A"/>
        <text x="105" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">UNIVERSITY OF TECHNOLOGY</text>
        <!-- Photo placeholder -->
        <rect x="75" y="88" width="60" height="65" rx="6" fill="#E2E8F0" stroke="#CBD5E1"/>
        <circle cx="105" cy="112" r="16" fill="#94A3B8"/>
        <path d="M 87 146 C 87 130, 123 130, 123 146 Z" fill="#94A3B8"/>
        <!-- Details -->
        <text x="105" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">AARAV SHARMA</text>
        <text x="105" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">DEPT OF COMPUTER SCIENCE</text>
        <!-- Barcode -->
        <rect x="40" y="215" width="130" height="24" fill="#F8FAFC" stroke="#E2E8F0"/>
        <path d="M 50 220 L 50 234 M 54 220 L 54 234 M 60 220 L 60 234 M 66 220 L 66 234 M 70 220 L 70 234 M 76 220 L 76 234 M 85 220 L 85 234 M 92 220 L 92 234 M 98 220 L 98 234 M 106 220 L 106 234 M 115 220 L 115 234 M 125 220 L 125 234 M 135 220 L 135 234 M 145 220 L 145 234 M 155 220 L 155 234" stroke="#0F172A" stroke-width="2.5"/>
      </g>
    </svg>